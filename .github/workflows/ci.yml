name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A test run is ~40s on ubuntu and ~100s on macos. The 20-minute ceiling is
    # there so a runner that never gets scheduled (or a hung install) fails
    # loudly instead of sitting in the queue looking "pending" forever. It is
    # deliberately generous: GitHub's default is 360 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Version coherence: package.json must match the latest v0.x release
      # tag unless the HEAD commit declares a Release-Bump/Rollback trailer.
      # Fail-soft on missing remotes (warns and skips instead of failing).
      - run: bash scripts/check-version-coherence.sh --mode=ci
      - run: npm run quality:report
      # transitions-generator test regenerates transitions.md via
      # scripts/generate-transitions.py, which requires PyYAML
      # (absent from the macOS runner image; present on ubuntu).
      - run: python3 -m pip install --break-system-packages pyyaml jsonschema
      - run: npm run verify:generated
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
