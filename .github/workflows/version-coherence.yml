name: Version Coherence

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - plugins/fusion-plugin-stelow/manifest.json
      - plugins/fusion-plugin-stelow/package.json
      - plugins/fusion-plugin-stelow/src/skills.ts
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - plugins/fusion-plugin-stelow/manifest.json
      - plugins/fusion-plugin-stelow/package.json
      - plugins/fusion-plugin-stelow/src/skills.ts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-coherence:
    name: Check package.json#version coherence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run version-coherence guard
        run: bash scripts/check-version-coherence.sh