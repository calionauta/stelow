id: architecture-contrast
version: 1
description: Run the invariants-first Architecture Contrast decision loop with structured receipts.
skill: stelow-workflow-architecture-contrast
mode: orchestrated
write_policy: artifact
permission_profile: inherit
tasks:
- id: contrast
  skill: stelow-workflow-architecture-contrast
  depends_on: []
  output: architecture/contrast.json
  output_schema: schemas/architecture-contrast.json
  human_boundary: coordinator
  when: always
  failure_policy: fail
  requirements:
  - pipeline
  - structured-output
- id: readable
  skill: stelow-workflow-architecture-contrast
  depends_on:
  - contrast
  output: architecture/architecture.md
  output_schema: schemas/markdown.json
  human_boundary: none
  when: always
  failure_policy: fail
  requirements:
  - pipeline
  - structured-output
partition: none
fallback:
  mode: sequential
  preserves:
  - artifact
