id: architecture-contrast
version: 2
description: Generate construction alternatives, then run the invariants-first
  Architecture Contrast decision loop over them with structured receipts.
skill: stelow-workflow-architecture-contrast
mode: orchestrated
write_policy: artifact
permission_profile: inherit
tasks:
# ── Diverge ────────────────────────────────────────────────────────
# The alternatives tasks live HERE, inside the canonical recipe, because the
# host runs ONE recipe per stage: it refuses any recipe that is not
# stage.execution.recipe. A separate `architecture-alternatives` recipe was
# therefore orphaned — declared in recipes/, reachable from no stage — and
# its output (the directions WITH their sketches) never reached the pick.
# Breadth controls the COUNT of proposals, never whether they happen: the
# decide chain depends on them, so gating the producer on fan-out skipped the
# whole recipe at breadth 1 (the host's width check refuses a recipe that can
# collapse to zero tasks). At breadth 1 this generates one proposal — which is
# what the visual gate needs — and the contrast compares whatever exists.
- id: alternatives
  skill: stelow-workflow-architecture-alternatives
  depends_on: []
  output: architecture/alternatives.json
  output_schema: schemas/architecture-alternatives.json
  when: always
  human_boundary: none
  failure_policy: fail
  requirements:
  - fanout
  - pipeline
  - structured-output
- id: alternatives-verify
  depends_on:
  - alternatives
  output: architecture/alternatives-verification.json
  output_schema: schemas/architecture-alternatives.json
  human_boundary: none
  skill: stelow-workflow-architecture-alternatives
  when: always
  failure_policy: fail
  requirements:
  - pipeline
  - structured-output
- id: alternatives-hybrid
  depends_on:
  - alternatives-verify
  output: architecture/alternatives.md
  output_schema: schemas/markdown.json
  human_boundary: none
  skill: stelow-workflow-architecture-alternatives
  when: always
  failure_policy: fail
  requirements:
  - pipeline
  - structured-output
# ── Decide ─────────────────────────────────────────────────────────
- id: contrast
  skill: stelow-workflow-architecture-contrast
  depends_on:
  - alternatives-hybrid
  output: architecture/contrast.json
  output_schema: schemas/architecture-contrast.json
  human_boundary: coordinator
  when: always
  failure_policy: fail
  requirements:
  - pipeline
  - structured-output
- id: readable
  skill: stelow-workflow-architecture-contrast
  depends_on:
  - contrast
  output: architecture/architecture.md
  output_schema: schemas/markdown.json
  human_boundary: none
  when: always
  failure_policy: fail
  requirements:
  - pipeline
  - structured-output
partition: none
fallback:
  mode: sequential
  preserves:
  - artifact
