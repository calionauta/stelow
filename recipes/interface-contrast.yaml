id: interface-contrast
version: 2
description: Generate interface alternatives with wireframes, then run the reaction-first
  Interface Contrast decision loop over them with structured receipts.
skill: stelow-workflow-interface-contrast
mode: orchestrated
write_policy: artifact
permission_profile: inherit
tasks:
# ── Diverge ────────────────────────────────────────────────────────
# The alternatives tasks live HERE, inside the canonical recipe, because the
# host runs ONE recipe per stage: it refuses any recipe that is not
# stage.execution.recipe ("Recipe X is not the current stage's canonical
# recipe"). A separate `interface-alternatives` recipe was therefore
# orphaned — declared in recipes/, reachable from no stage — and the output
# that mattered (the proposals WITH wireframes) never reached the interface
# gate. The gate is a VISUAL review; an option with no wireframe cannot be
# looked at.
# Breadth controls the COUNT of proposals, never whether they happen: the
# decide chain depends on them, so gating the producer on fan-out skipped the
# whole recipe at breadth 1 (the host's width check refuses a recipe that can
# collapse to zero tasks). At breadth 1 this generates one proposal — which is
# what the visual gate needs — and the contrast compares whatever exists.
- id: alternatives
  skill: stelow-workflow-interface-alternatives
  depends_on: []
  output: interfaces/alternatives.json
  output_schema: schemas/interface-alternatives.json
  when: always
  human_boundary: none
  failure_policy: fail
  requirements:
  - fanout
  - pipeline
  - structured-output
- id: alternatives-verify
  depends_on:
  - alternatives
  output: interfaces/alternatives-verification.json
  output_schema: schemas/interface-alternatives.json
  human_boundary: none
  skill: stelow-workflow-interface-alternatives
  when: always
  failure_policy: fail
  requirements:
  - pipeline
  - structured-output
- id: alternatives-hybrid
  depends_on:
  - alternatives-verify
  output: interfaces/alternatives.md
  output_schema: schemas/markdown.json
  human_boundary: none
  skill: stelow-workflow-interface-alternatives
  when: always
  failure_policy: fail
  requirements:
  - pipeline
  - structured-output
# ── Decide ─────────────────────────────────────────────────────────
# The contrast reads the proposals the tasks above produced: every option it
# compares must carry the wireframe of the proposal it came from, so the
# receipt describes something a reader can actually look at.
- id: contrast
  skill: stelow-workflow-interface-contrast
  depends_on:
  - alternatives-hybrid
  output: interfaces/contrast.json
  output_schema: schemas/interface-contrast.json
  human_boundary: coordinator
  when: always
  failure_policy: fail
  requirements:
  - pipeline
  - structured-output
- id: readable
  skill: stelow-workflow-interface-contrast
  depends_on:
  - contrast
  output: interfaces/interfaces.md
  output_schema: schemas/markdown.json
  human_boundary: none
  when: always
  failure_policy: fail
  requirements:
  - pipeline
  - structured-output
partition: none
fallback:
  mode: sequential
  preserves:
  - artifact
